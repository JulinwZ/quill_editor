<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Файлы базы знаний</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='quill/quill.snow.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Верхняя шапка -->
    <header class="topbar">
        <div class="topbar-left">
            <div class="brand-icon">📑</div>
            <h1 class="brand-title">Файлы базы знаний</h1>
            <span class="status-badge">Локально</span>
        </div>

        <div class="topbar-search">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Быстрый поиск по базе знаний..." oninput="handleSearch()">
        </div>

        <div class="topbar-right">
            <button class="btn-primary" onclick="createNewFile()">
                <span>+</span> Новый документ
            </button>
        </div>
    </header>

    <!-- Главный контейнер -->
    <div class="main-container">

        <!-- Левая колонка со списком файлов -->
        <aside class="sidebar">
            <span class="sidebar-title">Документы</span>

            <ul id="file-list" class="file-list">
                {% for file in files %}
                    <li class="file-item" onclick="loadFile('{{ file.display_name }}')">
                        <div class="file-item-header">
                            <div class="file-title-group">
                                <span class="file-icon">📄</span>
                                <span class="file-name">{{ file.display_name }}</span>
                            </div>
                        </div>
                    </li>
                {% endfor %}
            </ul>
        </aside>

        <!-- Правая колонка с редактором -->
        <main class="editor-area">

            <div class="doc-header-card">
                <div class="doc-title-wrapper">
                    <span class="doc-icon">📄</span>
                    <input type="text" id="doc-title" class="doc-title-input" placeholder="Название файла (например, Моя заметка)" oninput="triggerAutosave()">
                </div>

                <div class="doc-actions">
                    <!-- Статус автосохранения (скрыт для новых файлов) -->
                    <span id="save-status" class="save-status saved" style="display: none;">Все изменения сохранены</span>

                    <!-- Кнопка первоначального сохранения (видна только для новых файлов) -->
                    <button id="save-btn" class="btn-dark" onclick="manualSaveFile()">
                        <span>✓</span> Сохранить
                    </button>

                    <button id="export-btn" class="btn-secondary" onclick="exportDocx()">
                        <span>📥</span> DOCX
                    </button>
                    <button id="delete-btn" class="btn-danger" onclick="deleteCurrentFile()">
                        <span>🗑️</span> Удалить
                    </button>
                </div>
            </div>

            <div class="editor-card">
                <div id="editor"></div>
            </div>

        </main>
    </div>

    <script src="{{ url_for('static', filename='quill/quill.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>

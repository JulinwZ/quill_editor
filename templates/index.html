<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Файлы базы знаний</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='quill/quill.snow.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Верхняя шапка -->
    <header class="topbar">
        <div class="topbar-left">
            <div class="brand-icon">📑</div>
            <h1 class="brand-title">Файлы базы знаний</h1>
            <span class="status-badge">Локально</span>
        </div>

        <div class="topbar-search">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Быстрый поиск по базе знаний..." oninput="handleSearch()">
        </div>

        <div class="topbar-right">
            <button class="btn-secondary" onclick="openFolderModal()" style="margin-right: 8px;">
                <span>📁</span> + Папка
            </button>
            <button class="btn-primary" onclick="createNewFile()">
                <span>+</span> Новый документ
            </button>
        </div>
    </header>

    <!-- Главный контейнер -->
    <div class="main-container">

        <!-- Левая колонка со списком файлов и папок -->
        <aside class="sidebar">
            <span class="sidebar-title">Структура Storage</span>

            <div id="file-tree" class="file-tree">
                <!-- Дерево папок и файлов генерируется динамически через JS -->
            </div>
        </aside>

        <!-- Правая колонка с редактором -->
        <main class="editor-area">

            <div class="doc-header-card">
                <div class="doc-title-wrapper">
                    <span class="doc-icon">📄</span>
                    <input type="text" id="doc-title" class="doc-title-input" placeholder="Путь к файлу (например, Проекты/Моя заметка)" oninput="triggerAutosave()">
                </div>

                <div class="doc-actions">
                    <span id="save-status" class="save-status saved" style="display: none;">Все изменения сохранены</span>

                    <button id="save-btn" class="btn-dark" onclick="manualSaveFile()">
                        <span>✓</span> Сохранить
                    </button>

                    <button id="export-btn" class="btn-secondary" onclick="exportDocx()">
                        <span>📥</span> DOCX
                    </button>
                    <button id="delete-btn" class="btn-danger" onclick="deleteCurrentFile()">
                        <span>🗑️</span> Удалить
                    </button>
                </div>
            </div>

            <div class="editor-card">
                <div id="editor"></div>
            </div>

        </main>
    </div>

    <!-- Модальное окно создания папки -->
    <div id="folder-modal" class="modal-overlay" onclick="closeFolderModalOnBackdrop(event)">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Новая папка</h3>
                <button class="modal-close-btn" onclick="closeFolderModal()">✕</button>
            </div>
            <div class="modal-body">
                <label for="modal-folder-name" class="modal-label">Название директории</label>
                <input type="text" id="modal-folder-name" class="modal-input" placeholder="например, Проекты" onkeydown="handleModalKeyDown(event)">
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeFolderModal()">Отмена</button>
                <button class="btn-primary" onclick="submitNewFolder()">Создать папку</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='quill/quill.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
